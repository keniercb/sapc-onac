# SAPC-ONAC — Docker Compose para DESARROLLO
# Mirror del docker-compose.yml (prod) pero con:
#  - Volúmenes bind-mount para hot reload (cambios en código se reflejan al instante)
#  - pnpm dev (Next.js turbopack + bun --hot para API)
#  - PostgreSQL 16 + Redis 7 (idéntico a prod)
#  - Variables de entorno apuntando a dev
#  - Sin restart: unless-stopped (se reinicia solo si crashea)
#
# Uso:
#   docker compose -f infra/docker/docker-compose.dev.yml up -d
#   docker compose -f infra/docker/docker-compose.dev.yml down
#   docker compose -f infra/docker/docker-compose.dev.yml logs -f api web
#
# Comandos atajos en el Makefile raíz:
#   make dev-up        → levanta todo
#   make dev-down      → detiene todo
#   make dev-logs     → sigue logs
#   make dev-psql     → entra a psql
#   make dev-reset-db → resetea la BD y reseed

services:
  # ===== PostgreSQL 16 (idéntico a prod) =====
  postgres:
    image: postgres:16-bookworm
    container_name: sapc-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sapc_onac_dev
      POSTGRES_USER: sapc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sapc_dev_pwd}
      TZ: America/Havana
      PGTZ: America/Havana
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapc -d sapc_onac_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sapc-dev-net

  # ===== Redis 7 (idéntico a prod) =====
  redis:
    image: redis:7-alpine
    container_name: sapc-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sapc-dev-net

  # ===== pgAdmin (solo dev — opcional) =====
  # Acceso: http://localhost:5050 — user: admin@onac.cu / pass: admin
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sapc-pgadmin-dev
    restart: unless-stopped
    profiles: ["debug"]  # solo arranca con: docker compose --profile debug up
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@onac.cu
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sapc-dev-net

  # ===== Backend API (desarrollo con hot reload) =====
  # Imagen: node:26.2.0-bookworm-slim con pnpm 9 + tsx para hot reload
  # Monta el código fuente para que los cambios se reflejen sin rebuild
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api.dev
      args:
        # Proxy corporativo (build-time)
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        npm_config_registry: ${npm_config_registry:-}
        BUN_CONFIG_HTTP_PROXY: ${BUN_CONFIG_HTTP_PROXY:-${HTTP_PROXY:-}}
    container_name: sapc-api-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://sapc:${POSTGRES_PASSWORD:-sapc_dev_pwd}@postgres:5432/sapc_onac_dev?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod}
      CORS_ORIGIN: http://localhost:3000
      TZ: America/Havana
      WATCHPACK_POLLING: "true"
      # Proxy en runtime (para futuras llamadas salientes del backend)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,api,web,${NO_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: localhost,127.0.0.1,postgres,redis,api,web,${NO_PROXY:-}
      # Mirror npm (si aplica)
      npm_config_registry: ${npm_config_registry:-}
    volumes:
      # Bind-mount del código para hot reload
      - ../../apps/api:/app/apps/api
      - ../../packages/shared:/app/packages/shared
      # Persistencia de node_modules (no se sobreescribe con bind-mount)
      - api_dev_node_modules:/app/apps/api/node_modules
      # Persistencia de .prisma/client generado por prisma generate
      # (output = ../../../node_modules/.prisma/client desde apps/api/prisma/)
      - api_dev_prisma:/app/node_modules/.prisma
      - api_dev_prisma_client:/app/node_modules/@prisma/client
    ports:
      - "${API_PORT:-4000}:4000"
    command: >
      sh -c "cd /app &&
             pnpm install --no-frozen-lockfile &&
             cd /app/apps/api &&
             pnpm db:generate &&
             (pnpm db:push --accept-data-loss || echo 'db:push skipped') &&
             pnpm dev"
    networks:
      - sapc-dev-net

  # ===== Frontend Next.js (desarrollo con turbopack hot reload) =====
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web.dev
      args:
        # Proxy corporativo (build-time)
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        npm_config_registry: ${npm_config_registry:-}
        BUN_CONFIG_HTTP_PROXY: ${BUN_CONFIG_HTTP_PROXY:-${HTTP_PROXY:-}}
    container_name: sapc-web-dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
      TZ: America/Havana
      WATCHPACK_POLLING: "true"
      # Next.js 16: habilita turbopack
      NEXT_TURBOPACK: "1"
      # Proxy en runtime (p. ej. Next.js fetch saliente, server components)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,postgres,redis,api,web,${NO_PROXY:-}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: localhost,127.0.0.1,postgres,redis,api,web,${NO_PROXY:-}
      npm_config_registry: ${npm_config_registry:-}
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages/shared:/app/packages/shared
      - web_dev_node_modules:/app/apps/web/node_modules
      - web_dev_next:/app/apps/web/.next
      # Necesario para que Next.js encuentre @prisma/client compartido desde el api
      - api_dev_prisma:/app/node_modules/.prisma
    ports:
      - "${WEB_PORT:-3000}:3000"
    command: >
      sh -c "cd /app &&
             pnpm install --no-frozen-lockfile &&
             cd /app/apps/web &&
             pnpm dev"
    networks:
      - sapc-dev-net

networks:
  sapc-dev-net:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  pgadmin_dev_data:
  api_dev_node_modules:
  api_dev_prisma:
  api_dev_prisma_client:
  web_dev_node_modules:
  web_dev_next:
